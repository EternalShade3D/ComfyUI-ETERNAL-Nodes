[project]
name = "eternal-nodes"
description = "Eternal Nodes for ComfyUI by EternalShade3D: ▶ Panorama 360 Viewer(Load & inspect equirectangular panoramas with drag-to-orbit, scroll zoom, live FOV write-back, & seam/pole/horizon tilt checks) ▶ Flat Shade (GPU flat shading with split and crease modes) ▶ Mesh Bridge & Trimesh to Model3D (Types.MESH ⇄ trimesh conversion and GLB export) ▶ Tile Pipeline Eternal (Split, Source, Save, and Merge pipeline for high-res outpainting) ▶ Video Sizes & Aspect Ratio Size Picker"
version = "1.1.3"
license = { file = "LICENSE" }

keywords = ["comfyui", "eternal", "3d", "mesh", "flat-shade", "trimesh", "glb", "preview", "360", "panorama", "equirectangular", "tile", "outpaint"]

# trimesh is NOT in ComfyUI core requirements (verified) — the 3D nodes import it.
dependencies = ["trimesh"]

requires-python = ">=3.10"

classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/EternalShade3D/ComfyUI-ETERNAL-Nodes"
Issues = "https://github.com/EternalShade3D/ComfyUI-ETERNAL-Nodes/issues"
Documentation = "https://github.com/EternalShade3D/ComfyUI-ETERNAL-Nodes#readme"

[tool.comfy]
PublisherId = "eternal"
DisplayName = "Eternal Nodes"
Icon = "https://raw.githubusercontent.com/EternalShade3D/ComfyUI-ETERNAL-Nodes/main/icon.svg"